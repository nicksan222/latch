[package]
name = "latch-automation"
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false

[features]
browser-acceptance = []
containers = ["dep:testcontainers", "dep:tokio", "dep:env_logger"]

[[test]]
name = "native_browser"
required-features = ["browser-acceptance"]

[dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tempfile = "3"
libc = "0.2"
fs2 = "0.4"
blake3 = "1"
sha2 = "0.10"
tar = "0.4"
flate2 = "1"
semver = "1"
dirs = "5"

testcontainers = { version = "=0.28.0", default-features = false, features = ["watchdog"], optional = true }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "time", "io-util", "io-std"], optional = true }

env_logger = { version = "0.11", default-features = false, optional = true }

[[test]]
name = "containers"
required-features = ["containers"]
