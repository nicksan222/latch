[package]
name = "latch-core"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Shared vault, agent, and protocol implementation for Latch"

[lib]
name = "latch"

[dependencies]
latch-rpc = { path = "../rpc" }
tonic = { version = "0.14", features = ["transport"] }
tokio-stream = { version = "0.1", features = ["net"] }
tower = { version = "0.5", features = ["util"] }
hyper-util = { version = "0.1", features = ["tokio"] }
prost = "0.14"
async-stream = "0.3"
# crypto
age = { version = "0.11", features = ["armor", "ssh", "plugin"] }
argon2 = "0.5"
blake3 = "1"
ed25519-dalek = { version = "2", features = ["rand_core", "zeroize"] }
hkdf = "0.12"
sha1 = "0.10"
sha2 = "0.11"
hmac = "0.12"
x25519-dalek = { version = "2", features = ["static_secrets"] }
bech32 = "0.11"
rand = "0.8"
getrandom = "0.2"
zeroize = { version = "1", features = ["derive"] }
secrecy = "0.10"
data-encoding = "2"
base64 = "0.22"
# data
inventory = "0.3.25"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
time = { version = "0.3", features = ["serde", "formatting", "parsing", "macros"] }
thiserror = "2"
anyhow = "1"
# io / runtime
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "io-util", "sync", "time", "process", "signal", "fs"] }
dirs = "5"
tar = "0.4"
zstd = "0.13"
flate2 = "1"
tempfile = "3"
which = "7"
url = "2"
percent-encoding = "2"
csv = "1"
quick-xml = { version = "0.37", features = ["serialize"] }
serde_yaml = "0.9"
tracing = "0.1"
fs2 = "0.4"
reqwest = { version = "0.12", default-features = false, features = ["blocking", "rustls-tls"] }
zip = { version = "2.4", default-features = false, features = ["deflate"] }
regex = "1"
libc = "0.2"
arboard = { version = "3", default-features = false }

[dev-dependencies]
prost-reflect = "0.16"
proptest = "1"
