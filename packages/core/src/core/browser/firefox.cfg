// Latch managed Firefox. This first line must be a comment for AutoConfig.
(() => {
  Cu.importGlobalProperties(['IOUtils', 'PathUtils']);
  const { setInterval } = ChromeUtils.importESModule('resource://gre/modules/Timer.sys.mjs');
  let busy = false;
  async function writePrivateJSON(path, value) {
    await IOUtils.writeJSON(path, value, { tmpPath: path + '.tmp' });
    const file = Cc['@mozilla.org/file/local;1'].createInstance(Ci.nsIFile);
    file.initWithPath(path);
    file.permissions = 0o600;
  }
  async function reconcile() {
    if (busy) return;
    busy = true;
    const profile = Services.dirsvc.get('ProfD', Ci.nsIFile).path;
    const pending = PathUtils.join(profile, 'latch-credentials.json');
    const result = PathUtils.join(profile, 'latch-credentials-result.json');
    const ownership = PathUtils.join(profile, 'latch-login-ownership.json');
    let generation = '';
    try {
      if (!(await IOUtils.exists(pending))) return;
      const batch = await IOUtils.readJSON(pending);
      generation = typeof batch?.generation === 'string' ? batch.generation : '';
      await IOUtils.remove(pending);
      if (batch.version !== 1 || typeof batch.generation !== 'string' || !batch.generation || !Array.isArray(batch.credentials) || batch.credentials.length > 10000) throw new Error('invalid batch');
      await Services.logins.initializationPromise;
      const previous = await IOUtils.exists(ownership) ? await IOUtils.readJSON(ownership) : [];
      if (!Array.isArray(previous) || !previous.every(guid => typeof guid === 'string')) throw new Error('invalid ownership');
      const owned = new Set(previous);
      const saved = await Services.logins.getAllLogins();
      const next = [];
      const seen = new Set();
      const planned = [];
      for (const row of batch.credentials) {
        if (typeof row.id !== 'string' || !row.id || typeof row.origin !== 'string' || typeof row.username !== 'string' || typeof row.password !== 'string' || !row.password) throw new Error('invalid login');
        const uri = Services.io.newURI(row.origin);
        if (!['http', 'https'].includes(uri.scheme) || uri.prePath !== row.origin || uri.userPass) throw new Error('invalid origin');
        const key = JSON.stringify([row.origin, row.username]);
        if (seen.has(key)) throw new Error('duplicate login');
        seen.add(key);
        const existing = saved.find(login => login.origin === row.origin && login.username === row.username && login.httpRealm === null);
        if (existing && !owned.has(existing.guid)) throw new Error('browser-owned login conflicts with workspace login');
        planned.push({ row, existing, guid: existing ? existing.guid : Services.uuid.generateUUID().toString().slice(1, -1) });
      }
      // Write-ahead ownership makes an interrupted batch retryable. New records
      // carry these exact GUIDs, so none can become stranded as browser-owned.
      await writePrivateJSON(ownership, [...new Set([...previous, ...planned.map(item => item.guid)])]);
      for (const { row, existing, guid } of planned) {
        const login = Cc['@mozilla.org/login-manager/loginInfo;1'].createInstance(Ci.nsILoginInfo);
        login.init(row.origin, row.origin, null, row.username, row.password, '', '');
        login.QueryInterface(Ci.nsILoginMetaInfo).guid = guid;
        if (existing) {
          if (existing.password !== row.password) await Services.logins.modifyLoginAsync(existing, login);
          next.push(existing.guid);
        } else {
          const added = await Services.logins.addLoginAsync(login);
          next.push(added.guid);
        }
      }
      for (const login of saved) if (owned.has(login.guid) && !next.includes(login.guid)) await Services.logins.removeLoginAsync(login);
      await writePrivateJSON(ownership, next);
      await writePrivateJSON(result, { ok: true, generation: batch.generation, managed: next.length });
    } catch (_) {
      await IOUtils.remove(pending, { ignoreAbsent: true }).catch(() => {});
      await writePrivateJSON(result, { ok: false, generation }).catch(() => {});
    } finally { busy = false; }
  }
  Services.obs.addObserver(function ready(_window, topic) {
    Services.obs.removeObserver(ready, topic);
    reconcile().catch(() => {});
    setInterval(reconcile, 500);
  }, 'browser-delayed-startup-finished');
})();
