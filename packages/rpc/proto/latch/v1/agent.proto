  BrowserEngine engine = 1;
  optional string binary = 2;
  repeated string start_pages = 3;
  repeated Bookmark bookmarks = 4;
  bool extensions_allowed = 5;
  AutofillScope autofill = 6;
  repeated string autofill_entry_ids = 7;
}

message Bookmark {
  string title = 1;
  string url = 2;
}

message ProfileInput {
  string name = 1;
  string color = 2;
  string icon = 3;
  string description = 4;
  bool pinned = 5;
  BrowserSettings browser = 6;
}

message ProfileUpdateParams {
  string id = 1;
  ProfileInput input = 2;
}

message IdParams {
  string id = 1;
}

message EntrySummary {
  string id = 1;
  string profile_id = 2;
  EntryType type = 3; // legacy_rust_name: entry_type
  string name = 4;
  repeated string tags = 5;
  bool favorite = 6;
  optional string subtitle = 7;
  bool has_totp = 8;
  string updated_at = 9;
}

message Entry {
  string id = 1;
  string profile_id = 2;
  string name = 3;
  repeated string tags = 4;
  string notes = 5;
  bool favorite = 6;
  string created_at = 7;
  string updated_at = 8;
  EntryPayload payload = 9;
  repeated string redacted_fields = 10;
}

message EntryInput {
  string profile_id = 1;
  string name = 2;
  repeated string tags = 3;
  string notes = 4;
  bool favorite = 5;
  EntryPayload payload = 6;
}

message EntryUpdateParams {
  string id = 1;
  EntryInput input = 2;
}

message ListEntriesParams {
  optional string profile_id = 1;
  optional string query = 2;
  // legacy_rust_name: entry_type
  optional EntryType type = 3; // legacy_optional: true
}

message GetEntryParams {
