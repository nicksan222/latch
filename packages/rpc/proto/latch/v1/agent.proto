syntax = "proto3";
package latch.v1;

// Authoritative typed wire contract. No generic method/JSON RPC is exposed.
// Optional secret scalars preserve absent (keep) versus present empty (clear).
message Empty {}
message HookParams { string path = 1; optional string executable = 2; }
message HookResult { optional string path = 1; bool removed = 2; }
message StringValue { string value = 1; }
message UInt32Value { uint32 value = 1; }
message OptionalString { optional string value = 1; }
message OptionalEntryInput { EntryInput value = 1; }
message OptionalDomainRecipientKeyKind { optional DomainRecipientKeyKind value = 1; }
message OptionalParsedOtpauth { ParsedOtpauth value = 1; }
message StringMap { map<string, string> items = 1; }
message DomainEnvVarList { repeated EnvVar items = 1; }
message DomainStringList { repeated string items = 1; }
message DomainDiffRowList { repeated DomainDiffRow items = 1; }
message OptionalStringList { repeated string items = 1; }

enum DomainRecipientKeyKind {
  DOMAIN_RECIPIENT_KEY_KIND_UNSPECIFIED = 0;
  DOMAIN_RECIPIENT_KEY_KIND_AGE = 1; // legacy: age
  DOMAIN_RECIPIENT_KEY_KIND_SSH = 2; // legacy: ssh
  DOMAIN_RECIPIENT_KEY_KIND_PLUGIN = 3; // legacy: plugin
}

enum ErrorCode {
  ERROR_CODE_UNSPECIFIED = 0;
  ERROR_CODE_LOCKED = 1; // legacy: locked
  ERROR_CODE_NO_VAULT = 2; // legacy: no_vault
  ERROR_CODE_NOT_FOUND = 3; // legacy: not_found
  ERROR_CODE_ALREADY_EXISTS = 4; // legacy: already_exists
  ERROR_CODE_INVALID_PARAMS = 5; // legacy: invalid_params
  ERROR_CODE_BAD_CREDENTIALS = 6; // legacy: bad_credentials
  ERROR_CODE_INTEGRITY = 7; // legacy: integrity
  ERROR_CODE_CONFLICT = 8; // legacy: conflict
  ERROR_CODE_DENIED = 9; // legacy: denied
  ERROR_CODE_UNSUPPORTED_VERSION = 10; // legacy: unsupported_version
  ERROR_CODE_GIT = 11; // legacy: git
  ERROR_CODE_IO = 12; // legacy: io
  ERROR_CODE_INTERNAL = 13; // legacy: internal
}

enum ClientKind {
  CLIENT_KIND_UNSPECIFIED = 0;
  CLIENT_KIND_CLI = 1; // legacy: cli
  CLIENT_KIND_DESKTOP = 2; // legacy: desktop
}

enum AgentEventKind {
  AGENT_EVENT_KIND_UNSPECIFIED = 0;
  AGENT_EVENT_KIND_LOCKED = 1; // legacy: locked
  AGENT_EVENT_KIND_UNLOCKED = 2; // legacy: unlocked
  AGENT_EVENT_KIND_VAULT_CHANGED = 3; // legacy: vault_changed
  AGENT_EVENT_KIND_PROFILES_CHANGED = 4; // legacy: profiles_changed
  AGENT_EVENT_KIND_ENTRIES_CHANGED = 5; // legacy: entries_changed
  AGENT_EVENT_KIND_BROWSER_CHANGED = 6; // legacy: browser_changed
  AGENT_EVENT_KIND_SYNC_CHANGED = 7; // legacy: sync_changed
  AGENT_EVENT_KIND_LOCK_WARNING = 8; // legacy: lock_warning
}

enum RecipientKind {
  RECIPIENT_KIND_UNSPECIFIED = 0;
  RECIPIENT_KIND_PASSPHRASE = 1; // legacy: passphrase
  RECIPIENT_KIND_AGE = 2; // legacy: age
  RECIPIENT_KIND_SSH = 3; // legacy: ssh
  RECIPIENT_KIND_PLUGIN = 4; // legacy: plugin
  RECIPIENT_KIND_RECOVERY = 5; // legacy: recovery
}

// Legacy values remain wire-compatible. Product launches use managed Firefox only.
enum BrowserEngine {
  BROWSER_ENGINE_UNSPECIFIED = 0;
  BROWSER_ENGINE_CHROMIUM = 1; // legacy: chromium
  BROWSER_ENGINE_CHROME = 2; // legacy: chrome
  BROWSER_ENGINE_BRAVE = 3; // legacy: brave
  BROWSER_ENGINE_EDGE = 4; // legacy: edge
  BROWSER_ENGINE_FIREFOX = 5; // legacy: firefox
}

enum AutofillScope {
  AUTOFILL_SCOPE_UNSPECIFIED = 0;
  AUTOFILL_SCOPE_ALL = 1; // legacy: all
  AUTOFILL_SCOPE_SELECTED = 2; // legacy: selected
  AUTOFILL_SCOPE_NONE = 3; // legacy: none
}

enum EntryType {
  ENTRY_TYPE_UNSPECIFIED = 0;
  ENTRY_TYPE_LOGIN = 1; // legacy: login
  ENTRY_TYPE_SECRET = 2; // legacy: secret
  ENTRY_TYPE_ENV = 3; // legacy: env
  ENTRY_TYPE_FILE = 4; // legacy: file
  ENTRY_TYPE_NOTE = 5; // legacy: note
  ENTRY_TYPE_SSH_KEY = 6; // legacy: ssh_key
  ENTRY_TYPE_DATABASE = 7; // legacy: database
  ENTRY_TYPE_API_KEY = 8; // legacy: api_key
}

enum TotpAlgorithm {
  TOTP_ALGORITHM_UNSPECIFIED = 0;
  TOTP_ALGORITHM_SHA1 = 1; // legacy: SHA1
  TOTP_ALGORITHM_SHA256 = 2; // legacy: SHA256
  TOTP_ALGORITHM_SHA512 = 3; // legacy: SHA512
}

enum EnvFormat {
  ENV_FORMAT_UNSPECIFIED = 0;
  ENV_FORMAT_DOTENV = 1; // legacy: dotenv
  ENV_FORMAT_EXPORT = 2; // legacy: export
  ENV_FORMAT_JSON = 3; // legacy: json
}

enum VaultTrustState {
  VAULT_TRUST_STATE_UNSPECIFIED = 0;
  VAULT_TRUST_STATE_FIRST_USE = 1; // legacy: first_use
  VAULT_TRUST_STATE_PINNED = 2; // legacy: pinned
  VAULT_TRUST_STATE_STALE = 3; // legacy: stale
}

enum SyncMode {
  SYNC_MODE_UNSPECIFIED = 0;
  SYNC_MODE_BOTH = 1; // legacy: both
  SYNC_MODE_PULL_ONLY = 2; // legacy: pull_only
  SYNC_MODE_PUSH_ONLY = 3; // legacy: push_only
}

enum Resolution {
  RESOLUTION_UNSPECIFIED = 0;
  RESOLUTION_MINE = 1; // legacy: mine
  RESOLUTION_THEIRS = 2; // legacy: theirs
  RESOLUTION_MERGED = 3; // legacy: merged
}

enum ImportFormat {
  IMPORT_FORMAT_UNSPECIFIED = 0;
  IMPORT_FORMAT_DOTENV = 1; // legacy: dotenv
  IMPORT_FORMAT_BITWARDEN = 2; // legacy: bitwarden
  IMPORT_FORMAT_ONE_PASSWORD_CSV = 3; // legacy: one_password_csv
  IMPORT_FORMAT_KEEPASS_XML = 4; // legacy: keepass_xml
  IMPORT_FORMAT_BROWSER_CSV = 5; // legacy: browser_csv
  IMPORT_FORMAT_PASS = 6; // legacy: pass
  IMPORT_FORMAT_JSON = 7; // legacy: json
  IMPORT_FORMAT_YAML = 8; // legacy: yaml
  IMPORT_FORMAT_LATCH_ARCHIVE = 9; // legacy: latch_archive
}

enum ExportFormat {
  EXPORT_FORMAT_UNSPECIFIED = 0;
  EXPORT_FORMAT_LATCH_ARCHIVE = 1; // legacy: latch_archive
  EXPORT_FORMAT_JSON = 2; // legacy: json
  EXPORT_FORMAT_DOTENV = 3; // legacy: dotenv
}

enum Severity {
  SEVERITY_UNSPECIFIED = 0;
  SEVERITY_INFO = 1; // legacy: info
  SEVERITY_WARNING = 2; // legacy: warning
  SEVERITY_ERROR = 3; // legacy: error
}

enum Theme {
  THEME_UNSPECIFIED = 0;
  THEME_SYSTEM = 1; // legacy: system
  THEME_LIGHT = 2; // legacy: light
  THEME_DARK = 3; // legacy: dark
}

message DomainEntryTypeMetadata {
  EntryType type = 1;
  string label = 2;
  optional string primary_copy_field = 3;
  EntryPayload default_payload = 4;
}

message DomainCatalog {
  repeated DomainEntryTypeMetadata entry_types = 1;
  BrowserSettings default_browser_settings = 2;
  Settings default_settings = 3;
  TotpConfig default_totp = 4;
}

message ParsedOtpauth {
  TotpConfig totp = 1;
  optional string account = 2;
}

message PasswordStrength {
  uint32 score = 1; // legacy_uint_bits: 8
  string label = 2;
  uint32 bits = 3;
  repeated string hints = 4;
}

message EntryDefaultsInput {
  string profile_id = 1;
  EntryType entry_type = 2;
}

message ReadFieldInput {
  EntryPayload payload = 1;
  string path = 2;
}

message RedactedPayload {
  EntryPayload payload = 1;
  repeated string redacted = 2;
}

message PayloadMergeInput {
  EntryPayload stored = 1;
  EntryPayload input = 2;
}

message MergeEntriesInput {
  EntryInput mine = 1;
  EntryInput theirs = 2;
  repeated string from_theirs = 3;
}

message DomainEnvFormatInput {
  repeated EnvPair vars = 1;
  EnvFormat format = 2;
}

message ValidateRecipientInput {
  string label = 1;
  string key = 2;
  repeated RecipientInfo existing = 3;
}

message DiffRowsInput {
  EntryInput mine = 1; // legacy_optional: true
  EntryInput theirs = 2; // legacy_optional: true
}

message DomainDiffRow {
  string field = 1;
  string mine = 2;
  string theirs = 3;
  bool differs = 4;
  bool content_differs = 5;
}

message RpcError {
  ErrorCode code = 1;
  string message = 2;
}

message HelloParams {
  ClientKind client = 1;
  string version = 2;
}

message HelloResult {
  string agent_version = 1;
  uint32 protocol = 2;
}

message AgentEvent {
  AgentEventKind kind = 1;
  optional string profile_id = 2; // legacy_omittable: true
  optional string entry_id = 3; // legacy_omittable: true
  optional string message = 4; // legacy_omittable: true
}

message VaultStatus {
  bool initialized = 1;
  bool locked = 2;
  optional string vault_id = 3;
  optional string path = 4;
  repeated RecipientInfo recipients = 5;
  bool dirty = 6;
  uint32 ahead = 7;
  uint32 behind = 8;
  bool has_remote = 9;
  optional string last_sync_at = 10;
  optional uint64 locks_in_secs = 11;
  TrustStatus trust = 12; // legacy_optional: true
  repeated string integrity_problems = 13;
  bool rotation_pending = 14;
  optional bool memory_locked = 15;
}

message TrustStatus {
  VaultTrustState state = 1;
  string fingerprint = 2;
  uint64 key_seq = 3;
}

message ForgetTrustParams {
  bool confirm = 1; // legacy_default: true
}

message RecipientInfo {
  string label = 1;
  RecipientKind kind = 2;
  string public_key = 3;
  optional string added_at = 4;
}

message KdfParams {
  uint32 memory_kib = 1;
  uint32 iterations = 2;
  uint32 parallelism = 3;
}

message InitParams {
  string path = 1;
  string passphrase = 2;
  KdfParams kdf = 3; // legacy_optional: true
  optional string git_name = 4;
  optional string git_email = 5;
  optional string remote_url = 6;
  bool recovery_kit = 7;
}

message InitResult {
  VaultStatus status = 1;
  RecoveryKit recovery_kit = 2; // legacy_optional: true
}

message RecoveryKit {
  string vault_id = 1;
  string passphrase_public_key = 2;
  string recovery_public_key = 3;
  string recovery_secret_key = 4;
  string document = 5;
}

message CloneParams {
  string url = 1;
  string path = 2;
}

message OpenParams {
  string path = 1;
}

message KnownVault {
  string path = 1;
  string vault_id = 2;
  bool active = 3;
}

message UnlockParams {
  optional string passphrase = 1;
  optional string identity_file = 2;
  optional uint64 timeout_secs = 3;
}

message KdfBenchmarkParams {
  uint32 target_ms = 1;
}

message KdfBenchmark {
  KdfParams params = 1;
  uint32 measured_ms = 2;
}

message ChangePassphraseParams {
  string current = 1;
  string new_passphrase = 2;
}

message LaunchAction {
  string id = 1;
  string name = 2;
  string command = 3;
  repeated string env_entry_ids = 4;
  OptionalStringList env_keys = 5; // legacy_optional: true
  repeated string urls = 6;
}

message ActionInput {
  string name = 1;
  string command = 2;
  repeated string env_entry_ids = 3;
  OptionalStringList env_keys = 4; // legacy_optional: true
  repeated string urls = 5;
}

message ActionSaveParams {
  string profile_id = 1;
  optional string id = 2;
  ActionInput input = 3;
}

message ActionListResult {
  repeated LaunchAction actions = 1;
  optional string working_directory = 2;
}

message ActionConfigureParams {
  string profile_id = 1;
  optional string working_directory = 2;
}

message ActionIdParams {
  string profile_id = 1;
  string action_id = 2;
}

message ProfileSummary {
  string id = 1;
  string name = 2;
  string color = 3;
  string icon = 4;
  string description = 5;
  bool pinned = 6;
  uint32 entry_count = 7;
  bool browser_running = 8;
}

message Profile {
  string id = 1;
  string name = 2;
  string color = 3;
  string icon = 4;
  string description = 5;
  bool pinned = 6;
