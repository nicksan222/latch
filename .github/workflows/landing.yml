name: Website
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: landing-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build:
    name: Website
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: '1.4.4'
      - run: bun install --frozen-lockfile
      - name: Install E2E browser
        run: bunx --no-install playwright install --with-deps chromium
      - name: Test responsive landing and offline app demo
        run: bun run test:landing
      - name: Upload E2E failure evidence
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: landing-browser-failure-${{ github.run_attempt }}
          path: .dev/test-results/landing/
          include-hidden-files: true
          if-no-files-found: ignore
          retention-days: 3
      - name: Build and verify repository-subpath site
        run: |
          bun run build:landing
          bun run --filter @latch/landing verify
        env:
          LANDING_SITE: ${{ vars.LANDING_SITE }}
          LANDING_BASE: ${{ vars.LANDING_BASE }}
      - name: Upload Pages artifact
        if: github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: apps/landing/dist
  deploy:
    if: github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
