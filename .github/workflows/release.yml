name: 🚀 Release

on:
  push:
    branches: [main]
    tags: ['v*']

permissions:
  contents: read

# Serialize planning through publication, including explicit tags on the same SHA.
# queue:max preserves up to 100 pending releases instead of replacing pending runs.
concurrency:
  group: latch-releases
  cancel-in-progress: false
  queue: max

defaults:
  run:
    shell: bash

env:
  CI: 'true'

jobs:
  checks:
    name: 🧪 Checks
    uses: ./.github/workflows/test-reusable.yml

  plan:
    name: 🔎 Plan version
    needs: checks
    if: ${{ !github.event.repository.fork }}
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      version: ${{ steps.plan.outputs.version }}
      tag: ${{ steps.plan.outputs.tag }}
      sha: ${{ steps.plan.outputs.sha }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: '1.4.4'
      - name: Require the tested commit to belong to main
        run: git merge-base --is-ancestor "$GITHUB_SHA" origin/main
      - name: Plan from source, tags and the explicit increment policy
        id: plan
        run: node tooling/release/release-plan.mjs

  build:
    name: 📦 Build Linux artifacts
    needs: plan
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    env:
      RELEASE_VERSION: ${{ needs.plan.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.plan.outputs.sha }}
          persist-credentials: false
      - name: Build native packaging environment
        run: docker build --file .devcontainer/Dockerfile --build-arg LATCH_RUST_IMAGE=mcr.microsoft.com/devcontainers/rust:1-bookworm --tag latch-release .
      - name: Prepare versions and package in disposable checkout
        # This runner checkout is disposable; no commits, credentials or vaults.
        run: |
          docker run --rm --init --shm-size=1g \
            --mount "type=bind,source=$GITHUB_WORKSPACE,target=/workspace" \
            --volume /workspace/node_modules \
            --volume /workspace/target \
            --workdir /workspace \
            --env CI=true --env LATCH_RELEASE_BUILD=1 \
            --env RELEASE_VERSION --env CARGO_BUILD_JOBS=2 \
            --env CARGO_TARGET_DIR=/workspace/target \
            --env APPIMAGE_EXTRACT_AND_RUN=1 \
            latch-release cargo run --locked -p latch-automation --bin latch-automation -- release-build "$RELEASE_VERSION"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-linux
          path: release-artifacts/*
          if-no-files-found: error
          retention-days: 7

  publish:
    name: 🚀 Publish GitHub release
    needs: [plan, build]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    env:
      RELEASE_TAG: ${{ needs.plan.outputs.tag }}
      RELEASE_SHA: ${{ needs.plan.outputs.sha }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.plan.outputs.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: '1.4.4'
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release-linux
          path: release-artifacts
      - name: Verify assets and publish or resume draft
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        # GITHUB_TOKEN-created tags do not trigger another push workflow.
        run: node tooling/release/publish-release.mjs
